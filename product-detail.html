<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - BLESSIFICATOR</title>
    <meta name="description" content="Product detail">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="index.html" class="name">BLESSIFICATOR</a>
            </div>
            <div class="header-right">
                <a href="info.html" class="header-link">Info</a>
                <a href="contact.html" class="header-link">Contact</a>
                <a href="https://www.instagram.com/blessificator/" class="header-link" target="_blank"
                    rel="noopener noreferrer">IG</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container product-detail-container">
            <div class="product-detail-grid">
                <div class="product-detail-image">
                    <img src="" alt="Product" id="productImage">
                    <div class="additional-images" id="additionalImages"></div>
                </div>
                <div class="product-detail-info">
                    <h1 class="product-detail-name" id="productName">PRODUCT NAME</h1>
                    <div class="project-price" id="productPrice"
                        style="display: none; margin-bottom: 20px; font-size: 1.2rem;"></div>
                    <div class="size-selector" id="sizeSelector"></div>
                    <button class="buy-button" id="buyButton">
                        <div class="red-blur-effect"></div>
                        <span class="buy-button-text">BUY</span>
                    </button>

                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>©2025, BLESSIFICATOR</p>
        </div>
    </footer>

    <script src="products.js"></script>
    <script>
        // Get product data from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let productData = {};

        // Check for ID parameter first
        const productId = urlParams.get('id');
        if (productId && products[productId]) {
            productData = products[productId];
        } else {
            // Fallback to URL parameters
            productData = {
                name: urlParams.get('name') || 'PRODUCT NAME',
                image: urlParams.get('image') || '',
                additionalImages: urlParams.get('additionalImages') || '',
                priceId: urlParams.get('priceId') || '',
                price: urlParams.get('price') || '',
                description: urlParams.get('description') || '',
                buyLink: urlParams.get('buyLink') || ''
            };
        }

        // Update page content
        document.getElementById('productName').textContent = productData.name;
        document.getElementById('productImage').src = productData.image;
        document.getElementById('productImage').alt = productData.name;

        // Add price with currency conversion if available
        if (productData.price) {
            const priceDiv = document.getElementById('productPrice');
            priceDiv.setAttribute('data-base-price', productData.price);
            priceDiv.textContent = `${productData.price} PLN`;
            priceDiv.style.display = 'block';

            (async () => {
                try {
                    const geoResponse = await fetch('https://ipwho.is/');
                    const geoData = await geoResponse.json();
                    if (!geoData.success) throw new Error('Could not determine location');

                    const countryCode = geoData.country_code;
                    const isEu = geoData.is_eu;

                    const currencyMap = {
                        'PL': 'PLN', 'US': 'USD', 'GB': 'GBP', 'CA': 'CAD', 'AU': 'AUD',
                        'CH': 'CHF', 'JP': 'JPY', 'CN': 'CNY', 'CZ': 'CZK', 'DK': 'DKK',
                        'NO': 'NOK', 'SE': 'SEK', 'HU': 'HUF', 'RO': 'RON', 'BG': 'BGN',
                        'TR': 'TRY', 'IL': 'ILS', 'AE': 'AED', 'UA': 'UAH'
                    };

                    let userCurrency = currencyMap[countryCode] || (isEu ? 'EUR' : 'USD');
                    if (userCurrency === 'PLN') return;

                    const ratesResponse = await fetch('https://api.exchangerate-api.com/v4/latest/PLN');
                    const ratesData = await ratesResponse.json();
                    const rate = ratesData.rates[userCurrency];
                    if (!rate) throw new Error('Currency rate not found');

                    const convertedPrice = productData.price * rate;
                    const formatter = new Intl.NumberFormat(undefined, {
                        style: 'currency',
                        currency: userCurrency,
                        maximumFractionDigits: 0
                    });

                    priceDiv.textContent = formatter.format(convertedPrice);
                } catch (error) {
                    console.error('Error fetching currency data:', error);
                }
            })();
        }

        // Add description if provided
        if (productData.description) {
            const descriptionDiv = document.createElement('div');
            descriptionDiv.className = 'product-description';
            descriptionDiv.innerHTML = productData.description; // Allow HTML for links
            document.querySelector('.product-detail-info').insertBefore(descriptionDiv, document.getElementById('buyButton'));
        }

        // Add additional images if provided
        if (productData.additionalImages) {
            const additionalImagesContainer = document.getElementById('additionalImages');
            const images = productData.additionalImages.split('|');
            images.forEach(imagePath => {
                if (imagePath.trim()) {
                    const img = document.createElement('img');
                    img.src = imagePath.trim();
                    img.alt = productData.name;
                    img.className = 'additional-image';
                    additionalImagesContainer.appendChild(img);
                }
            });
        }

        // Buy button handler
        const buyButton = document.getElementById('buyButton');
        const buyButtonText = buyButton.querySelector('.buy-button-text');

        // Check if item has igBuy property for custom Instagram DM link logic
        if (productData.igBuy) {
            buyButton.style.display = 'flex'; // Use flex to match original button alignment context if needed, or inline-block. CSS uses just margin.
            buyButtonText.style.transition = 'opacity 0.3s ease';
            buyButtonText.textContent = 'BUY';
            
            buyButton.onclick = (e) => {
                if (buyButtonText.textContent === 'BUY') {
                    // First click: transition behavior
                    e.preventDefault();
                    buyButtonText.style.opacity = '0';
                    setTimeout(() => {
                         // Wrap the text in an A tag so it functions like a hard hyperlink natively (can be right-clicked/long-pressed)
                        const linkEl = document.createElement('a');
                        linkEl.href = 'https://www.instagram.com/blessificator/';
                        linkEl.target = '_blank';
                        linkEl.rel = 'noopener noreferrer';
                        linkEl.style.textDecoration = 'none';
                        linkEl.style.color = 'inherit';
                        linkEl.textContent = 'BUY via Instagram DM';
                        
                        // Replace the entire content of buyButtonText with the link
                        buyButtonText.innerHTML = '';
                        buyButtonText.appendChild(linkEl);
                        buyButtonText.style.opacity = '1';

                        // Change the onclick behavior so full button area works
                        buyButton.onclick = () => window.open('https://www.instagram.com/blessificator/', '_blank', 'noopener,noreferrer');
                    }, 300);
                }
            };
        }
        // Check global visibility toggle (Legacy toggle)
        else if (typeof config !== 'undefined' && config.showBuyButtons === false) {
            buyButton.style.display = 'none';
        }
        // Size Selector Logic (New "Reveal" Flow)
        else if (productData.variants) {
            const sizeSelector = document.getElementById('sizeSelector');
            const sizes = Object.keys(productData.variants);

            // Initial State: Size Selector Hidden, Buy Button Visible
            sizeSelector.style.display = 'none';
            buyButtonText.textContent = "BUY";
            buyButton.disabled = false;

            // Generate Size Buttons
            sizes.forEach(size => {
                const sizeBtn = document.createElement('button');
                sizeBtn.className = 'size-option';
                sizeBtn.textContent = size;

                sizeBtn.onclick = () => {
                    const variantId = productData.variants[size];
                    if (variantId) {
                        // Immediate Redirect
                        window.location.href = `https://blessificator-com.myshopify.com/cart/${variantId}:1`;
                    } else {
                        alert("Sorry, this size is currently unavailable.");
                    }
                };
                sizeSelector.appendChild(sizeBtn);
            });

            // Buy Button Click -> Reveal Sizes
            buyButton.onclick = () => {
                buyButton.style.display = 'none'; // Hide Buy Button
                sizeSelector.style.display = 'flex'; // Show Sizes
                // Optional: Trigger specific animation or focus if needed
            };
        }
        // Legacy/Simple Product Logic (No separate sizes)
        else if (productData.buyLink) {
            buyButton.addEventListener('click', () => {
                window.location.href = productData.buyLink;
            });
        }
        else if (!productData.priceId) {
            buyButton.style.display = 'none';
        }
        else {
            // Stripe Flow (Legacy)
            buyButton.addEventListener('click', async () => {
                buyButton.disabled = true;
                buyButton.querySelector('.buy-button-text').textContent = 'LOADING...';

                try {
                    const response = await fetch('/api/create-checkout-session', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            productName: productData.name,
                            productImage: productData.image,
                            priceId: productData.priceId,
                            quantity: 1
                        }),
                    });

                    const data = await response.json();

                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        throw new Error('No checkout URL received');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                    buyButton.disabled = false;
                    buyButton.querySelector('.buy-button-text').textContent = 'BUY';
                }
            });
        }
    </script>
</body>

</html>
