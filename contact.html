<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BLESSIFICATOR</title>
    <meta name="description" content="Contact">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="index.html" class="name">BLESSIFICATOR</a>
            </div>
            <div class="header-right">
                <a href="info.html" class="header-link">Info</a>
                <a href="contact.html" class="header-link">Contact</a>
                <a href="https://www.instagram.com/blessificator/" class="header-link" target="_blank" rel="noopener noreferrer">IG</a>
            </div>
        </div>
    </header>

    <main class="main info-main">
        <div class="info-content">
            <div class="contact-intro">
                <p>WRITE YOUR INQUIRY & LEAVE YOUR CONTACT SO THAT I CAN REACH OUT TO YOU. FEEL FREE TO BUY, OFFER A COLLABORATION OR WRITE ANYTHING ELSE YOU WANT</p>
            </div>
            <form class="contact-form" action="https://formsubmit.co/maksym.works@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New Contact Form Submission">
                <input type="hidden" name="_captcha" value="false">
                <textarea name="message" class="contact-textarea" placeholder="Your message..." required></textarea>
                <button type="submit" class="contact-submit">
                    <div class="red-blur-effect"></div>
                    <span class="submit-text">SUBMIT</span>
                </button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>©2025, BLESSIFICATOR</p>
        </div>
    </footer>
</body>
</html>
